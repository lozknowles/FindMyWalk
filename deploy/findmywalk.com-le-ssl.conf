<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName findmywalk.com
    ServerAlias www.findmywalk.com
    DocumentRoot /var/www/findmywalk.com

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.findmywalk\.com$ [NC]
    RewriteRule ^/(.*)$ https://findmywalk.com/$1 [R=301,L,NE]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://100.125.120.114:3110/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse / http://100.125.120.114:3110/

    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; media-src 'self' blob:"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Permissions-Policy "camera=(self), geolocation=(self), microphone=()"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/findmywalk.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/findmywalk.com/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/findmywalk.com-error.log
    LogFormat "%h %t \"%m %U\" %>s %b" findmywalk_sanitized
    CustomLog ${APACHE_LOG_DIR}/findmywalk.com-access.log findmywalk_sanitized
</VirtualHost>
</IfModule>
