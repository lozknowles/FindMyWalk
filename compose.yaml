services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: findmywalk
      POSTGRES_USER: findmywalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - findmywalk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findmywalk -d findmywalk"]
      interval: 5s
      timeout: 3s
      retries: 20
  routing:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    environment:
      tile_urls: https://download.geofabrik.de/europe/united-kingdom/england/nottinghamshire-latest.osm.pbf
      server_threads: 2
      build_elevation: "False"
    ports:
      - "127.0.0.1:18082:8002"
    volumes:
      - findmywalk-valhalla:/custom_files
volumes:
  findmywalk-postgres:
  findmywalk-valhalla:
