<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Find My Walk is coming soon: walking routes, maps, and directions for your next local route."
    >
    <title>Find My Walk | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="hero" aria-labelledby="page-title">
      <img
        class="hero__image"
        src="assets/find-my-walk-hero.png"
        alt="Illustrated walking trail with a map, route markers, and direction signs."
      >
      <div class="hero__shade" aria-hidden="true"></div>

      <section class="hero__content">
        <p class="eyebrow">Maps, routes, directions</p>
        <h1 id="page-title">Find My Walk</h1>
        <p class="lede">
          A new way to discover local walks, follow clear directions, and keep
          track of the routes worth wandering again.
        </p>

        <div class="launch-panel" aria-label="Coming soon details">
          <p class="launch-panel__label">Coming soon</p>
          <p class="launch-panel__copy">
            We are plotting the first routes now. Lace up and check back shortly.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
